---
- ansible.builtin.debug:
    msg: START cli/basic.yaml on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml

- name: Configure a multiline motd banner
  cisco.asa.asa_banner: &id001
    banner: motd
    text: |
      +---+
      this is my motd banner
      +---+
    state: present
  register: result

- name: Assert the banner was configured
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.commands == ['banner motd +---+', 'banner motd this is my motd banner',
        'banner motd +---+']

- name: Configure the same banner again (idempotent)
  cisco.asa.asa_banner: *id001
  register: result

- name: Assert no change
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.commands == []

- name: Remove the banner
  cisco.asa.asa_banner:
    banner: motd
    state: absent
  register: result

- name: Assert the banner was removed
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.commands == ['no banner motd']

- name: Remove the banner again (idempotent)
  cisco.asa.asa_banner:
    banner: motd
    state: absent
  register: result

- name: Assert no change
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.commands == []

- ansible.builtin.debug:
    msg: END cli/basic.yaml on connection={{ ansible_connection }}
